[project]
name = "pixelrag-langchain"
version = "0.2.0"
description = "LangChain Tool + Retriever for PixelRAG (screenshot-native visual search) — unofficial community integration"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Navneet Singh" },
]
keywords = ["langchain", "langgraph", "rag", "pixelrag", "visual-search", "agents", "vlm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "langchain-core>=0.3.0,<0.4.0",
    "httpx>=0.27.0,<0.28.0",
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
# Only needed if you want this package to also render pages/PDFs to tiles
# locally rather than pointing at an already-running pixelrag-serve instance.
render = [
    "playwright>=1.45.0,<2.0.0",
]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-httpx>=0.30.0,<0.31.0",
    "respx>=0.21.0,<0.22.0",
]

[project.urls]
Homepage = "https://github.com/navneet-singh2907/pixelrag-langchain"
Repository = "https://github.com/navneet-singh2907/pixelrag-langchain"
"Upstream PixelRAG (not affiliated)" = "https://github.com/StarTrail-org/PixelRAG"
"PixelRAG paper" = "https://papers.cool/arxiv/2606.28344"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelrag_langchain"]
